name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with MSBuild (VS targeting pack for net48)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          Write-Host "MSBuild: $msbuild"
          & $msbuild src/PanPlugin/PanPlugin.csproj -restore -p:Configuration=Release -m -v:m -nologo -bl:build.binlog

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanPlugin-win7
          path: src/PanPlugin/bin/Release/net48/
          if-no-files-found: error

      - name: Upload binlog (diagnosis, only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-binlog
          path: build.binlog
