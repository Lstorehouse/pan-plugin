name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (net48 WinForms)
        run: dotnet build src/PanPlugin/PanPlugin.csproj -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanPlugin-win7
          path: src/PanPlugin/bin/Release/net48/
          if-no-files-found: error
